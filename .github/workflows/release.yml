name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Leave blank to use the ref that triggered the workflow."
        required: false
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Bootstrap Gradle wrapper jar
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f gradle/wrapper/gradle-wrapper.jar ]]; then
            echo "Wrapper jar already present"
            exit 0
          fi

          url="$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d'=' -f2- | sed 's/\\\\:/:/g' | tr -d '\r')"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          echo "Downloading Gradle distribution: $url"
          curl -sSL "$url" -o "$tmp/gradle.zip"

          main_path="$(unzip -Z1 "$tmp/gradle.zip" | grep -E 'gradle-wrapper-main-[^/]*\\.jar$' | head -n 1)"
          shared_path="$(unzip -Z1 "$tmp/gradle.zip" | grep -E 'gradle-wrapper-shared-[^/]*\\.jar$' | head -n 1)"
          if [[ -z "$main_path" || -z "$shared_path" ]]; then
            echo "Gradle wrapper jars not found in distribution archive" >&2
            exit 1
          fi

          unzip -p "$tmp/gradle.zip" "$main_path" > "$tmp/wrapper-main.jar"
          unzip -p "$tmp/gradle.zip" "$shared_path" > "$tmp/wrapper-shared.jar"

          merge_dir="$tmp/merged"
          mkdir -p "$merge_dir"
          unzip -q "$tmp/wrapper-main.jar" -d "$merge_dir"
          unzip -q "$tmp/wrapper-shared.jar" -d "$merge_dir"

          rm -f "$merge_dir/META-INF/MANIFEST.MF" "$merge_dir/META-INF/"*.SF "$merge_dir/META-INF/"*.RSA "$merge_dir/META-INF/"*.DSA || true
          manifest="$tmp/MANIFEST.MF"
          cat > "$manifest" <<'EOF'
          Manifest-Version: 1.0
          Main-Class: org.gradle.wrapper.GradleWrapperMain
          EOF

          mkdir -p gradle/wrapper
          jar cfm gradle/wrapper/gradle-wrapper.jar "$manifest" -C "$merge_dir" .

      - name: Build and test
        run: bash ./gradlew clean build --no-daemon --console=plain

      - name: Prepare release assets
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          jar="$(ls -1 build/libs/*.jar | grep -Ev '(-sources|-javadoc)\\.jar$' | head -n 1)"
          out="dist/raid-extraction.jar"
          cp "$jar" "$out"
          (cd dist && sha256sum "$(basename "$out")" > SHA256SUMS.txt)

      - name: Remove existing release assets (reruns)
        uses: actions/github-script@v7
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        with:
          script: |
            const tag = process.env.TAG;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              const deleteNames = new Set(["raid-extraction.jar", "SHA256SUMS.txt"]);
              for (const asset of release.assets || []) {
                if (!deleteNames.has(asset.name)) continue;
                core.info(`Deleting existing asset: ${asset.name}`);
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
            } catch (err) {
              if (err && err.status === 404) {
                core.info(`No existing release for tag ${tag}; continuing.`);
                return;
              }
              throw err;
            }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.jar
            dist/SHA256SUMS.txt
