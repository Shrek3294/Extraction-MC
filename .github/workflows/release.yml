name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Leave blank to use the ref that triggered the workflow."
        required: false
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Fetch Gradle wrapper jar
        run: bash ./scripts/fetch-gradle-wrapper.sh

      - name: Build and test
        run: bash ./gradlew clean build --no-daemon --console=plain

      - name: Prepare release assets
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          jar="$(ls -1 build/libs/*.jar | grep -Ev '(-sources|-javadoc)\\.jar$' | head -n 1)"
          out="dist/raid-extraction.jar"
          cp "$jar" "$out"
          (cd dist && sha256sum "$(basename "$out")" > SHA256SUMS.txt)

      - name: Remove existing release assets (reruns)
        uses: actions/github-script@v7
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        with:
          script: |
            const tag = process.env.TAG;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              const deleteNames = new Set(["raid-extraction.jar", "SHA256SUMS.txt"]);
              for (const asset of release.assets || []) {
                if (!deleteNames.has(asset.name)) continue;
                core.info(`Deleting existing asset: ${asset.name}`);
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
            } catch (err) {
              if (err && err.status === 404) {
                core.info(`No existing release for tag ${tag}; continuing.`);
                return;
              }
              throw err;
            }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.jar
            dist/SHA256SUMS.txt
