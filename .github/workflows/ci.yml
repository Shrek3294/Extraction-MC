name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Fetch Gradle wrapper jar
        run: bash ./scripts/fetch-gradle-wrapper.sh

      - name: Build and test
        run: bash ./gradlew clean build --no-daemon --console=plain
