name: RaidExtraction
main: com.raidextraction.RaidExtractionPlugin
version: 0.1.0
description: Data-driven Paper plugin providing a raid-to-extraction gameplay loop.
api-version: "1.21"
commands:
  raid:
    description: Join or check raid queues.
    permission: raid.user
    usage: "/raid <join|leave|status|hud>"
  stash:
    description: View or manage loot stored in your stash.
    permission: raid.user
    usage: "/stash"
  weapon:
    description: Weapon utilities (guide, bench) and admin tools.
    permission: raid.user
    usage: "/weapon <guide|bench|apply|give|debugspells>"
    aliases: [rexweapon]
  raidadmin:
    description: Administrative raid controls for testing and moderation.
    permission: raid.admin
    usage: "/raidadmin <start|stop|cancel|force-extract|edit|exit|save|validate|undo|debugbounds|lootchance|lootpreview>"
  quest:
    description: View and manage quests.
    permission: raid.user
    usage: "/quest <list|accept|claim|info>"
permissions:
  raid.user:
    description: Allows participation in raids and stash access.
    default: true
  raid.admin:
    description: Allows administrative control over raids and extraction states.
    default: op
