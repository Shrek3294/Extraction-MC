# Raid definitions. Each raid references a loot table and optional evac zones.
raids:
  default_raid:
    world: world
    min_players: 1
    max_players: 4
    duration_seconds: 900
    loot_table: starter_cache
    evac_zones:
      - name: Town Plaza
        world: world
        x: 100
        y: 64
        z: 100
        radius: 6
      - name: Forest Camp
        world: world
        x: -32
        y: 68
        z: 240
        radius: 5
  future_city:
    world: future_city
    min_players: 1
    max_players: 4
    duration_seconds: 900
    loot_table: starter_cache
    evac_zones: []
    spawn:
      x: -174
      y: 63
      z: 171
      yaw: 0
      pitch: 0
    target_loot_count: 50
